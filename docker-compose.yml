version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vendorbridge_postgres
    restart: always
    environment:
      POSTGRES_USER: vendorbridge
      POSTGRES_PASSWORD: vendorbridge
      POSTGRES_DB: vendorbridge
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vendorbridge -d vendorbridge']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
