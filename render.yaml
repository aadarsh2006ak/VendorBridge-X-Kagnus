databases:
  - name: vendorbridge-db
    databaseName: vendorbridge
    user: vendorbridge_user
    plan: free
    region: oregon

services:
  - type: web
    name: vendorbridge
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vendorbridge-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: ADMIN_INVITE_CODE
        value: ADMIN_SECRET_INVITE_2026
      - key: COOKIE_SECURE
        value: true

